<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Playground</title>
    <link rel="stylesheet" href="./app.css" />
  </head>

  <body class="min-h-dvh text-foreground bg-gray-800">
    <main class="flex h-dvh flex-col gap-2 p-2">
      <section class="flex shrink-0 items-center justify-start gap-2 flex-wrap">
        <button id="playMkv" class="px-3 border border-gray-500 disabled:opacity-50">Play</button>
        <input
          class="min-w-80 flex-1 px-3 border border-gray-500"
          type="url"
          id="videoUrl"
          value="https://rqbit.anitrack.frixaco.com/torrents/11/stream/0/[SubsPlease]%20Re%20Zero%20kara%20Hajimeru%20Isekai%20Seikatsu%20-%2083%20(1080p)%20[1D8BC969].mkv"
        />
        <input
          class="px-3 border border-gray-500"
          type="file"
          id="inputMkv"
          accept=".mkv,video/x-matroska"
        />

        <input class="px-3 border border-gray-500" type="file" id="inputImg" accept="image/*" />
        <button id="processBtn" class="px-3 disabled:opacity-50 border border-gray-500">
          Process
        </button>
        <button id="benchmarkBtn" class="px-3 disabled:opacity-50 border border-gray-500" disabled>
          Benchmark
        </button>
        <button id="saveBtn" class="px-3 disabled:opacity-50 border border-gray-500" disabled>
          Save output PNG
        </button>

        <div class="relative">
          <pre id="status" class="max-w-80 overflow-auto px-3 text-sm whitespace-pre-wrap"></pre>
          <div
            id="benchmarkPopup"
            class="absolute top-0 right-0 z-10 hidden min-w-80 border border-gray-500 p-2"
          >
            <div class="flex items-start justify-between gap-2">
              <pre id="benchmarkMeta" class="text-sm whitespace-pre-wrap"></pre>
              <button id="benchmarkCloseBtn" class="px-2 border border-gray-500">Close</button>
            </div>
          </div>
        </div>
      </section>

      <section class="flex min-h-0 flex-1 flex-col">
        <div class="flex justify-between gap-2 text-sm">
          <span id="originalLabel">Original · no Anime4K</span>
          <span id="upscaledLabel">Anime4K · 2×</span>
        </div>
        <div id="comparison">
          <div id="originalViewport" class="comparison-viewport" aria-label="Original video view">
            <img id="original" alt="Original source preview" />
            <canvas id="originalVideo" class="hidden" aria-label="Original video"></canvas>
          </div>
          <div id="upscaledViewport" class="comparison-viewport" aria-label="Upscaled video view">
            <canvas id="canvas" class="hidden" aria-label="Upscaled video"></canvas>
          </div>
          <button
            id="comparisonDivider"
            type="button"
            role="slider"
            aria-label="Original and upscaled split"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
            aria-valuetext="50% original, 50% upscaled"
            aria-orientation="horizontal"
          ></button>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
