<!doctype html>
<html lang="en" class="scheme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Playground</title>
    <link rel="stylesheet" href="./app.css" />
  </head>

  <body class="min-h-dvh text-foreground bg-gray-800">
    <main class="flex h-dvh flex-col gap-2 p-2">
      <section class="flex shrink-0 items-center justify-start gap-2 flex-wrap">
        <button id="playMkv" class="px-3 border border-gray-500 disabled:opacity-50">Play</button>
        <input
          class="min-w-80 flex-1 px-3 border border-gray-500"
          type="url"
          id="videoUrl"
          value="https://rqbit.anitrack.frixaco.com/torrents/13/stream/0/[SubsPlease]%20Re%20Zero%20kara%20Hajimeru%20Isekai%20Seikatsu%20-%2085%20(1080p)%20[C0F3B0D6].mkv"
        />
        <input
          class="px-3 border border-gray-500"
          type="file"
          id="inputMkv"
          accept=".mkv,video/x-matroska"
        />

        <input class="px-3 border border-gray-500" type="file" id="inputImg" accept="image/*" />
        <button id="processBtn" class="px-3 disabled:opacity-50 border border-gray-500">
          Process
        </button>
        <button id="benchmarkBtn" class="px-3 disabled:opacity-50 border border-gray-500" disabled>
          Benchmark
        </button>
        <button id="saveBtn" class="px-3 disabled:opacity-50 border border-gray-500" disabled>
          Save output PNG
        </button>

        <div class="relative">
          <pre id="status" class="max-w-80 overflow-auto px-3 text-sm whitespace-pre-wrap"></pre>
          <div
            id="benchmarkPopup"
            class="absolute top-0 right-0 z-10 hidden min-w-80 border border-gray-500 p-2"
          >
            <div class="flex items-start justify-between gap-2">
              <pre id="benchmarkMeta" class="text-sm whitespace-pre-wrap"></pre>
              <button id="benchmarkCloseBtn" class="px-2 border border-gray-500">Close</button>
            </div>
          </div>
        </div>
      </section>

      <section class="flex min-h-0 flex-1 flex-col">
        <div class="flex justify-between gap-2 text-sm">
          <span id="originalLabel">Original · no Anime4K</span>
          <span id="upscaledLabel">Anime4K · 2×</span>
        </div>
        <div id="comparison" class="relative min-h-0 flex-1 overflow-hidden bg-black [--split:50%]">
          <!-- Explicit CSS sizing keeps the canvas backing dimensions from growing with DPR. -->
          <canvas
            id="subtitleCanvas"
            class="pointer-events-none absolute inset-0 z-1 h-full w-full"
          ></canvas>
          <!-- Clip full-size layers so moving the divider never resizes either frame. -->
          <div
            id="originalViewport"
            class="absolute inset-0 [clip-path:inset(0_calc(100%_-_var(--split))_0_0)]"
            aria-label="Original video view"
          >
            <img
              id="original"
              class="h-full w-full object-contain [&:not([src])]:hidden"
              alt="Original source preview"
            />
            <canvas
              id="originalVideo"
              class="hidden h-full w-full object-contain"
              aria-label="Original video"
            ></canvas>
          </div>
          <div
            id="upscaledViewport"
            class="absolute inset-0 [clip-path:inset(0_0_0_var(--split))]"
            aria-label="Upscaled video view"
          >
            <canvas
              id="canvas"
              class="hidden h-full w-full object-contain"
              aria-label="Upscaled video"
            ></canvas>
          </div>
          <button
            id="comparisonDivider"
            class="absolute inset-y-0 left-(--split) z-2 w-6 -translate-x-1/2 touch-none cursor-col-resize border-0 bg-transparent p-0 after:absolute after:inset-y-0 after:left-1/2 after:w-px after:bg-white/25 after:content-[''] focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white"
            type="button"
            role="slider"
            aria-label="Original and upscaled split"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
            aria-valuetext="50% original, 50% upscaled"
            aria-orientation="horizontal"
          ></button>
        </div>
        <div class="flex w-full items-center gap-2">
          <button id="pause" class="border px-2">Pause</button>
          <button id="stop" class="border px-2">Stop</button>
          <div id="seekbar" class="w-full h-4 bg-gray-900 cursor-pointer"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
